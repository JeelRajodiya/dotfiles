default:
  main: orchestrator
  auto-spawn: true
  auto-spawn-limit: 3
  default-variant: balanced
  subs:
    - tracer
    - worker
    - reviewer
  variants:
    quality:
      all:
        model: openai-codex/gpt-6-sol
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-6-astra
        thinking: low
    balanced-sol:
      all:
        model: openai-codex/gpt-6-luna
        thinking: high
        fast: false
      orchestrator:
        model: openai-codex/gpt-6-sol
        thinking: high
    balanced-sol-review:
      all:
        model: openai-codex/gpt-6-luna
        thinking: high
        fast: false
      orchestrator:
        model: openai-codex/gpt-6-sol
        thinking: high
      tracer:
        thinking: medium
      reviewer:
        model: openai-codex/gpt-6-sol
        thinking: high
    balanced-astra:
      all:
        model: openai-codex/gpt-6-luna
        thinking: high
        fast: false
      orchestrator:
        model: openai-codex/gpt-6-astra
        thinking: low
    economy:
      all:
        model: openai-codex/gpt-6-luna
        thinking: high
        fast: false
      orchestrator:
        model: openai-codex/gpt-6-luna
        thinking: max

plan-build:
  - planner
  - builder
  - reviewer

tracer-worker:
  main: tracer
  subs:
    - worker
