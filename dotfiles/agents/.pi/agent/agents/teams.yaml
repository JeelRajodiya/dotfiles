default:
  main: orchestrator
  auto-spawn: true
  auto-spawn-limit: 3
  subs:
    - tracer
    - worker
    - reviewer
  variants:
    quality:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
      worker:
        thinking: low
    quality-fast:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        fast: false
      worker:
        thinking: low
    balanced:
      all:
        model: openai-codex/gpt-5.6-terra
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-sol
      reviewer:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
    balanced-fast:
      all:
        model: openai-codex/gpt-5.6-terra
        thinking: medium
        fast: true
      orchestrator:
        model: openai-codex/gpt-5.6-sol
        fast: false
      reviewer:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
    economy:
      all:
        model: openai-codex/gpt-5.6-luna
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-sol
    economy-fast:
      all:
        model: openai-codex/gpt-5.6-luna
        thinking: medium
        fast: true
      orchestrator:
        model: openai-codex/gpt-5.6-sol
        fast: false
    sprint:
      all:
        model: openai-codex/gpt-5.6-terra
        thinking: medium
        fast: true
      orchestrator:
        model: openai-codex/gpt-5.6-sol
        fast: false
      worker:
        model: openai-codex/gpt-5.3-codex-spark
        thinking: medium
        fast: false
      reviewer:
        model: openai-codex/gpt-5.3-codex-spark
        thinking: medium
        fast: false
    turbo:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        fast: false
      worker:
        model: openai-codex/gpt-5.3-codex-spark
        thinking: medium
        fast: false
    turbo+:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        fast: false
      tracer:
        model: openai-codex/gpt-5.3-codex-spark
        thinking: medium
        fast: false
      worker:
        model: openai-codex/gpt-5.3-codex-spark
        thinking: medium
        fast: false

plan-build:
  - planner
  - builder
  - reviewer

tracer-worker:
  main: tracer
  subs:
    - worker
