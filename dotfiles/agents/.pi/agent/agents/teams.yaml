default:
  main: orchestrator
  auto-spawn: true
  auto-spawn-limit: 3
  default-variant: balanced-terra
  subs:
    - tracer
    - worker
    - reviewer
  variants:
    quality-sol:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
      worker:
        thinking: low
    quality-sol-fast:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        fast: false
      worker:
        thinking: low
    balanced-sol:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
      tracer:
        model: openai-codex/gpt-5.6-terra
      worker:
        model: openai-codex/gpt-5.6-terra
    balanced-sol-fast:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        fast: false
      tracer:
        model: openai-codex/gpt-5.6-terra
      worker:
        model: openai-codex/gpt-5.6-terra
    balanced-terra:
      all:
        model: openai-codex/gpt-5.6-terra
        thinking: medium
        fast: false
      reviewer:
        model: openai-codex/gpt-5.6-sol
    balanced-terra-fast:
      all:
        model: openai-codex/gpt-5.6-terra
        thinking: medium
        fast: true
      reviewer:
        model: openai-codex/gpt-5.6-sol
    economy-sol:
      all:
        model: openai-codex/gpt-5.6-luna
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-sol
    economy-sol-fast:
      all:
        model: openai-codex/gpt-5.6-luna
        thinking: medium
        fast: true
      orchestrator:
        model: openai-codex/gpt-5.6-sol
        fast: false
    economy-terra:
      all:
        model: openai-codex/gpt-5.6-luna
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-terra
    economy-terra-fast:
      all:
        model: openai-codex/gpt-5.6-luna
        thinking: medium
        fast: true
      orchestrator:
        model: openai-codex/gpt-5.6-terra
    sprint-sol:
      all:
        model: openai-codex/gpt-5.3-codex-spark
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-sol
      tracer:
        model: openai-codex/gpt-5.6-terra
    sprint-sol-fast:
      all:
        model: openai-codex/gpt-5.3-codex-spark
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-sol
      tracer:
        model: openai-codex/gpt-5.6-terra
        fast: true
    turbo-sol:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
      worker:
        model: openai-codex/gpt-5.3-codex-spark
    turbo-sol-fast:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        fast: false
      worker:
        model: openai-codex/gpt-5.3-codex-spark
        fast: false
    turbo-terra:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-terra
      worker:
        model: openai-codex/gpt-5.3-codex-spark
    turbo-terra-fast:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        model: openai-codex/gpt-5.6-terra
      worker:
        model: openai-codex/gpt-5.3-codex-spark
        fast: false
    turbo-plus-sol:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
      tracer:
        model: openai-codex/gpt-5.3-codex-spark
      worker:
        model: openai-codex/gpt-5.3-codex-spark
    turbo-plus-sol-fast:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        fast: false
      tracer:
        model: openai-codex/gpt-5.3-codex-spark
        fast: false
      worker:
        model: openai-codex/gpt-5.3-codex-spark
        fast: false
    turbo-plus-terra:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-5.6-terra
      tracer:
        model: openai-codex/gpt-5.3-codex-spark
      worker:
        model: openai-codex/gpt-5.3-codex-spark
    turbo-plus-terra-fast:
      all:
        model: openai-codex/gpt-5.6-sol
        thinking: medium
        fast: true
      orchestrator:
        model: openai-codex/gpt-5.6-terra
      tracer:
        model: openai-codex/gpt-5.3-codex-spark
        fast: false
      worker:
        model: openai-codex/gpt-5.3-codex-spark
        fast: false

plan-build:
  - planner
  - builder
  - reviewer

tracer-worker:
  main: tracer
  subs:
    - worker
