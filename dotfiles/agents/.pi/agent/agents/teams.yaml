default:
  main: orchestrator
  auto-spawn: true
  auto-spawn-limit: 3
  default-variant: balanced
  subs:
    - tracer
    - worker
    - reviewer
  variants:
    quality:
      all:
        model: openai-codex/gpt-6-sol
        thinking: medium
        fast: false
      orchestrator:
        model: openai-codex/gpt-6-astra
        thinking: low
    balanced:
      all:
        model: openai-codex/gpt-6-luna
        thinking: max
        fast: false
      orchestrator:
        model: openai-codex/gpt-6-sol
        thinking: medium
    economy:
      all:
        model: openai-codex/gpt-6-luna
        thinking: max
        fast: false

plan-build:
  - planner
  - builder
  - reviewer

tracer-worker:
  main: tracer
  subs:
    - worker
